name: CI

on:
  push:
    branches: [master, develop, dev]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` runs the postinstall vendor sync, so this also proves that the
      # browser-facing files we copy out of node_modules still exist upstream.
      - run: npm ci

      - run: npm run lint

      # The build asserts that every AMD dependency resolves inside the bundle
      # and that no local @import survives into the CSS, so both fail here
      # rather than as a silent 404 or a lost stylesheet in the browser.
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The suite pins channel "chrome" so CI and local runs drive the same
      # browser; Playwright no longer ships Chromium for macOS 13.
      - run: npx playwright install --with-deps chrome

      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
